[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "viralconstellations"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "zstandard>=0.21",
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
